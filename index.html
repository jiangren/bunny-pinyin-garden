<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ed"><meta name="description" content="和小兔一起，点一点、听一听，在游戏里认识六个单韵母。"><title>小兔拼音乐园 · 每天一点点，快乐学拼音</title><style>:root{--bg:#f7f5ed;--ink:#294a40;--muted:#697b71;--green:#356b53;--coral:#d56a4d;--line:#e4e8dc;--radius:24px;--shadow:0 10px 30px -20px #294a4055}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft Yahei",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;color:inherit}button{transition:transform .18s,background .18s}button:hover{transform:translateY(-2px)}button:active{transform:scale(.97)}button:focus-visible,a:focus-visible{outline:3px solid #d56a4d;outline-offset:5px}header{max-width:1240px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:26px 32px;gap:24px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-size:20px;font-weight:750;letter-spacing:1px}.brand-mark{background:var(--green);color:#fff8ea;border-radius:16px 16px 16px 5px;font-size:23px;padding:9px 12px}.brand small{display:block;font-size:10px;letter-spacing:2px;font-weight:400;margin-top:5px;color:var(--muted)}nav{display:flex;gap:10px}.nav{border:0;background:transparent;padding:12px 18px;font-size:14px}.nav.active{background:#e5ebdd;border-radius:30px;font-weight:700}.parent{background:transparent;border:1px solid #d5ddcf;border-radius:30px;padding:12px 18px;font-size:12px}main{max-width:1176px;margin:auto;padding:0 32px}.hero{min-height:455px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:40px;padding:34px 0 42px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:650;color:var(--green)}.eyebrow i{display:inline-block;width:7px;height:7px;background:var(--coral);border-radius:50%;margin-right:9px}h1{font-size:49px;line-height:1.42;letter-spacing:1px;margin:18px 0;font-weight:800}h1 span{color:var(--coral);position:relative}h1 span:after{content:"";position:absolute;left:0;bottom:-6px;width:100%;height:5px;background:#e8b852;border-radius:50%;transform:rotate(-5deg)}.hero p{color:var(--muted);font-size:15px;line-height:1.9;margin:16px 0 25px}.primary{border:0;border-radius:14px;background:var(--green);color:#fff;padding:17px 24px;font-size:15px;font-weight:650;box-shadow:inset 0 1px 0 #ffffff30,0 8px 20px -10px #356b5380}.primary span{margin-left:24px}.hero-foot{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:10px;margin-top:22px}.hero-foot b{color:#bac4b4}.garden{height:360px;background:#e7eddc;border-radius:48% 48% 38% 38%;position:relative;isolation:isolate;overflow:hidden}.sun{position:absolute;width:63px;height:63px;background:#ebbd60;border-radius:50%;left:64px;top:37px;box-shadow:0 0 0 12px #ebbd6017}.cloud{position:absolute;background:#f7f8ef;width:65px;height:20px;border-radius:50%}.cloud:before{content:"";position:absolute;border-radius:50%;width:32px;height:28px;background:inherit;top:-13px;left:17px}.c1{right:70px;top:60px}.c2{left:30px;top:152px;transform:scale(.7)}.hill{position:absolute;background:#d4dfbd;border-radius:50%;width:550px;height:180px;bottom:-70px;left:-100px;transform:rotate(12deg)}.h2{background:#bfcfa8;left:200px;bottom:-85px;transform:rotate(-15deg)}.bunny{position:absolute;width:170px;height:240px;left:50%;top:68px;transform:translateX(-50%) rotate(-5deg)}.ear{position:absolute;top:0;width:42px;height:112px;border-radius:55% 55% 35% 35%;background:#fffaf0}.ear:after{content:"";position:absolute;inset:12px 12px 18px;background:#edb3a3;border-radius:50%}.ear.left{left:36px;transform:rotate(-17deg)}.ear.right{right:23px;transform:rotate(12deg)}.face{position:absolute;top:78px;width:162px;height:137px;border-radius:48%;background:#fffaf0;box-shadow:0 10px 20px -12px #8d986c80}.body{position:absolute;width:122px;height:110px;border-radius:50%;background:#faf3e5;bottom:0;left:20px}.eye{position:absolute;background:#395440;width:7px;height:11px;border-radius:50%;top:53px}.e1{left:49px}.e2{right:46px}.cheek{position:absolute;width:23px;height:12px;border-radius:50%;background:#f1c4af;top:72px}.ch1{left:24px}.ch2{right:23px}.nose{position:absolute;top:67px;left:78px;width:8px;height:6px;background:#cc9b87;border-radius:50%}.mouth{position:absolute;left:74px;top:65px;font-size:21px}.float-letter{font-family:Georgia,serif;font-size:60px;position:absolute;font-weight:bold}.l1{left:52px;top:96px;color:var(--coral);transform:rotate(-15deg)}.l2{right:62px;top:113px;color:var(--green);transform:rotate(13deg)}.l3{right:98px;top:205px;color:#ac852e;transform:rotate(-12deg)}.garden-note{position:absolute;background:#fffaf0;border-radius:16px;bottom:28px;left:50%;transform:translateX(-50%) rotate(-3deg);padding:12px 22px;white-space:nowrap;font-size:13px;box-shadow:var(--shadow)}.flower{position:absolute;font-size:43px;bottom:29px;color:#c58661}.f1{left:44px}.f2{right:27px;bottom:48px;color:#fff7d2;font-size:34px}.sprout{position:absolute;left:118px;bottom:4px;color:var(--green);font-size:50px}.workspace{padding-top:25px;border-top:1px solid var(--line);scroll-margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}h2{font-size:25px;letter-spacing:1px;margin:10px 0 0}.progress-pill{font-size:12px;border:1px solid #d6dfce;border-radius:30px;padding:10px 16px}.letters{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}.letter-card{border:1px solid #e4e5d9;background:#fffdf7;position:relative;padding:20px 12px 16px;border-radius:var(--radius);min-height:202px;box-shadow:var(--shadow);text-align:center}.letter-card:nth-child(2n){background:#f1eee3}.letter-card:nth-child(3n){background:#eaf0e4}.letter-card .big{display:block;font-family:Georgia,"Times New Roman",serif;font-size:65px;color:var(--coral);line-height:1.2}.letter-card:nth-child(2n) .big{color:#b18b36}.letter-card:nth-child(3n) .big{color:var(--green)}.picture{display:block;font-size:32px;margin:12px 0 6px}.hint{display:block;font-size:12px;color:var(--muted)}.learned{position:absolute;right:12px;top:10px;font-size:12px;color:var(--green)}.listening-tip{text-align:center;font-size:12px;color:var(--muted);padding:20px 0}.game-layout{background:#fffdf7;border:1px solid var(--line);border-radius:var(--radius);padding:32px;text-align:center;min-height:280px}.mode-tabs{display:flex;justify-content:center;gap:8px;margin-bottom:24px}.mode-tabs button{border:1px solid var(--line);background:transparent;border-radius:24px;padding:10px 18px;font-size:13px}.mode-tabs .selected{background:#e5ebdd;border-color:#b9caaa}.game-question{font-size:22px;margin:16px 0}.options{display:flex;justify-content:center;gap:16px;margin:24px auto}.options{max-width:448px}.option{flex:1;min-width:0;max-width:100px;background:#f1f1e8;border:2px solid transparent;border-radius:18px;font-family:Georgia,serif;font-size:42px;width:100px;min-height:88px}.option.correct{border-color:var(--green);background:#dcebd6}.option.retry{border-color:#ddaa6d;background:#fff0da}.feedback{min-height:28px;font-size:15px;color:var(--green)}.secondary{border:1px solid #ccd8c3;background:#eef2e6;padding:12px 22px;border-radius:12px;min-height:48px}.stars-display{font-size:42px;letter-spacing:12px;color:#b88a2d;overflow-wrap:anywhere;margin:22px 0}.journey{display:flex;align-items:center;gap:20px;background:#e9eddf;border-radius:20px;padding:24px 28px;margin:24px 0 32px}.journey-symbol{font-size:44px;color:#9a7f36}.journey h3{margin:0 0 6px;font-size:16px}.journey p{margin:0;color:var(--muted);font-size:12px}.journey>span{margin-left:auto;font-size:12px;color:var(--muted)}footer{border-top:1px solid var(--line);max-width:1112px;margin:auto;padding:22px 0 30px;display:flex;gap:20px;align-items:center;font-size:11px;color:var(--muted)}.brand-footer{font-weight:750;color:var(--green)}footer button{margin-left:auto;border:0;background:none;font-size:11px}dialog{border:0;border-radius:28px;background:#fffcf3;color:var(--ink);padding:42px;max-width:480px;width:calc(100% - 32px);box-shadow:0 24px 80px #18342440}dialog::backdrop{background:#294a4066;backdrop-filter:blur(4px)}dialog p{line-height:1.9;color:var(--muted);font-size:14px}dialog h2{margin-bottom:18px}.close{position:absolute;right:16px;top:10px;border:0;background:transparent;font-size:28px;min-width:40px;min-height:40px}.modal-letter{font-family:Georgia,serif;font-size:96px;color:var(--coral)}.tone-row{display:flex;justify-content:center;gap:8px;margin:18px 0}.tone-row button{font-family:Georgia,serif;font-size:28px;min-width:58px;min-height:58px;border:1px solid var(--line);border-radius:12px;background:#eef2e6}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:14px 24px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;font-size:14px;max-width:90vw}.toast.show{opacity:1}@media(max-width:800px){header{padding:20px;flex-wrap:wrap}.brand{font-size:17px}.parent{font-size:11px;padding:10px}nav{order:3;width:100%;justify-content:center}.hero{gap:16px;min-height:380px}h1{font-size:35px}.garden{height:310px}.hero-foot{flex-wrap:wrap;font-size:9px}.letters{grid-template-columns:repeat(3,1fr)}.letter-card{min-height:185px}.journey>span{display:none}footer{margin:0 24px}.garden .l1{left:20px}.garden .l2{right:22px}.garden .l3{right:28px}.sun{left:30px}.f1{left:15px}}@media(max-width:560px){main{padding:0 20px}.hero{grid-template-columns:1fr;padding-top:12px;gap:28px}.hero-copy{text-align:center}h1{font-size:39px;margin:14px 0}.hero p{font-size:14px}.hero-foot{justify-content:center}.garden{width:100%;max-width:360px;margin:auto;height:300px}.bunny{top:30px}.garden-note{bottom:20px}.hero .primary{width:100%;max-width:320px}.workspace{padding-top:24px}.section-head{gap:12px}h2{font-size:20px}.progress-pill{font-size:10px;white-space:nowrap;padding:9px 10px}.eyebrow{font-size:10px}.letters{gap:10px}.letter-card{padding:14px 6px;min-height:171px;border-radius:20px}.letter-card .big{font-size:55px}.picture{font-size:29px}.hint{font-size:11px}.journey{padding:20px;gap:14px}.journey p{font-size:11px;line-height:1.7}.game-layout{padding:24px 12px}.options{gap:8px}.option{width:auto;font-size:32px}.game-question{font-size:19px}dialog{padding:34px 22px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

<body><header><a class="brand" href="#"><span class="brand-mark">兔</span><span>小兔拼音乐园<small>把好奇心，变成小小进步</small></span></a><nav aria-label="主要导航"><button class="nav active" data-view="learn">拼音小课堂</button><button class="nav" data-view="game">玩一玩</button><button class="nav" data-view="stars">我的星星</button></nav><button class="parent" id="parent">家长小贴士 ↗</button></header>
<main><section class="hero"><div class="hero-copy"><span class="eyebrow"><i></i> 给小小探索家的拼音启蒙</span><h1>和小兔一起，<br>把拼音<span>玩</span>起来。</h1><p>小耳朵听一听，小嘴巴读一读。<br>今天，也要收获一点点快乐！</p><button class="primary" id="start">开始今天的小冒险 <span>→</span></button><div class="hero-foot"><span>适合 4 岁启蒙</span><b>·</b><span>一次玩 5 分钟</span><b>·</b><span>没有计时，慢慢来</span></div></div><div class="garden" aria-label="小兔和拼音字母的花园插画" role="img"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><span class="float-letter l1">a</span><span class="float-letter l2">o</span><span class="float-letter l3">e</span><div class="hill h1"></div><div class="hill h2"></div><div class="bunny"><div class="ear left"></div><div class="ear right"></div><div class="body"></div><div class="face"><i class="eye e1"></i><i class="eye e2"></i><i class="cheek ch1"></i><i class="cheek ch2"></i><i class="nose"></i><span class="mouth">ᴗ</span></div></div><div class="garden-note">你好呀，小小拼音家！</div><div class="flower f1">✿</div><div class="flower f2">✿</div><div class="sprout">⌁</div></div></section>
<section class="workspace" id="classroom"><div class="section-head"><div><span class="eyebrow" id="section-kicker">第一站 · 认识新朋友</span><h2 id="section-title">6 个韵母，6 个好朋友</h2></div><span class="progress-pill" id="progress">已认识 0 / 6</span></div><div id="view"></div></section>
<section class="journey"><div class="journey-symbol">✧</div><div><h3>一点点，就很棒。</h3><p>今天认识一个新朋友，也是值得庆祝的小进步。</p></div><span>陪伴比学会更重要</span></section></main><footer><span class="brand-footer">小兔拼音乐园</span><span>听见好奇，看见成长。</span><button id="about">关于发音</button></footer>
<dialog id="modal"><button class="close" aria-label="关闭">×</button><div id="modal-content"></div></dialog><div class="toast" role="status" id="toast"></div><script>const letters=[{key:'a',word:'阿姨',pic:'👩',tip:'张大嘴巴 a a a',sound:'啊',tones:['ā','á','ǎ','à'],sounds:['阿','啊','啊','啊']},{key:'o',word:'公鸡',pic:'🐓',tip:'圆圆嘴巴 o o o',sound:'喔',tones:['ō','ó','ǒ','ò'],sounds:['喔','喔','喔','喔']},{key:'e',word:'白鹅',pic:'🪿',tip:'扁扁嘴巴 e e e',sound:'鹅',tones:['ē','é','ě','è'],sounds:['婀','鹅','恶','饿']},{key:'i',word:'衣服',pic:'👕',tip:'牙齿对齐 i i i',sound:'衣',tones:['ī','í','ǐ','ì'],sounds:['衣','姨','椅','意']},{key:'u',word:'乌龟',pic:'🐢',tip:'嘴巴突出 u u u',sound:'乌',tones:['ū','ú','ǔ','ù'],sounds:['乌','无','五','物']},{key:'ü',word:'小鱼',pic:'🐟',tip:'小嘴撅起 ü ü ü',sound:'迂',tones:['ǖ','ǘ','ǚ','ǜ'],sounds:['迂','鱼','雨','玉']}];
let state={learned:[],stars:0};try{const s=JSON.parse(localStorage.getItem('bunny-pinyin')||'null');if(s&&Array.isArray(s.learned)&&Number.isFinite(s.stars))state={learned:s.learned.filter(x=>letters.some(l=>l.key===x)),stars:Math.max(0,s.stars)}}catch{}let active='learn',mode='listen',question=null,answered=false,muted=false;const view=document.querySelector('#view'),modal=document.querySelector('#modal');let timer;
function save(){try{localStorage.setItem('bunny-pinyin',JSON.stringify(state))}catch{}}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),3000)}
function speak(t){if(!('speechSynthesis'in window)){toast('当前设备不能朗读，请和家长一起读一读');return}const voices=speechSynthesis.getVoices();const chinese=voices.find(v=>v.lang==='zh-CN')||voices.find(v=>/^zh/.test(v.lang));if(voices.length&&!chinese){toast('设备没有中文语音，请和家长一起读一读');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';if(chinese)u.voice=chinese;u.rate=.7;u.onerror=()=>toast('朗读暂时不可用，请和家长一起读');speechSynthesis.speak(u)}
function openModal(html){document.querySelector('#modal-content').innerHTML=html;if(!modal.open)modal.showModal()}
document.querySelector('.close').onclick=()=>modal.close();modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});
function setView(v,scroll=false){active=v;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.querySelector('#progress').textContent=v==='stars'?`收集了 ${state.stars} 颗星星`:`已认识 ${state.learned.length} / 6`;document.querySelector('#section-kicker').textContent={learn:'第一站 · 认识新朋友',game:'第二站 · 小耳朵大本领',stars:'每一次尝试，都值得鼓励'}[v];document.querySelector('#section-title').textContent={learn:'6 个韵母，6 个好朋友',game:'和拼音朋友捉迷藏',stars:'你的小小星星花园'}[v];if(v==='learn')renderLearn();if(v==='game')renderGame();if(v==='stars')renderStars();if(scroll)document.querySelector('#classroom').scrollIntoView({behavior:'smooth'})}
function renderLearn(){view.innerHTML='<div class="letters">'+letters.map((l,i)=>`<button class="letter-card" data-letter="${i}" aria-label="认识韵母 ${l.key}，${l.word}">${state.learned.includes(l.key)?'<span class="learned">✓</span>':''}<span class="big">${l.key}</span><span class="picture" aria-hidden="true">${l.pic}</span><span class="hint">${l.word} · 点我听一听</span></button>`).join('')+'</div><div class="listening-tip">点一点卡片，让拼音朋友和你打个招呼</div>';view.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>lesson(+b.dataset.letter))}
function lesson(i){const l=letters[i];openModal(`<div style="text-align:center"><span class="eyebrow">你好，我是你的拼音朋友</span><div class="modal-letter">${l.key}</div><h2>${l.pic} ${l.word}</h2><p>${l.tip}<br>看一看嘴巴，跟着家长读一读。</p><button class="primary" id="listen-letter">听一听 ${l.key}</button><p style="font-size:11px">中文语音以汉字近似示音，不代替标准拼音教学音频。</p><button class="secondary" id="mark-learned">${state.learned.includes(l.key)?'再认识一次，也很棒':'我认识这个朋友啦'} ✓</button></div>`);document.querySelector('#listen-letter').onclick=()=>speak(l.sound);document.querySelector('#mark-learned').onclick=()=>{if(!state.learned.includes(l.key)){state.learned.push(l.key);state.stars++;save()}modal.close();setView('learn');toast('好棒呀！又和拼音朋友亲近了一点')};speak(l.sound)}
function random(n){return Math.floor(Math.random()*n)}
function renderGame(){view.innerHTML='<div class="game-layout"><div class="mode-tabs"><button data-mode="listen" class="'+(mode==='listen'?'selected':'')+'">听音找朋友</button><button data-mode="tone" class="'+(mode==='tone'?'selected':'')+'">声调小滑梯</button></div><div id="game-body"></div></div>';view.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;renderGame()});nextQuestion()}
function nextQuestion(){answered=false;const l=letters[random(letters.length)];question={letter:l,tone:random(4)};const body=document.querySelector('#game-body');if(mode==='listen'){const options=[l,...letters.filter(x=>x!==l).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);body.innerHTML='<div class="game-question">小耳朵听一听，是哪位朋友？</div><button class="primary" id="play-question">听一听声音 ♫</button><div class="options">'+options.map(x=>`<button class="option" data-answer="${x.key}" aria-label="选择 ${x.key}">${x.key}</button>`).join('')+'</div>'}else{const descriptions=['一声平平走','二声往上扬','三声拐个弯','四声往下降'];body.innerHTML=`<div class="game-question">${descriptions[question.tone]}，帮 ${l.key} 找帽子</div><p style="color:var(--muted);font-size:13px">${['一声：—','二声：／','三声：∨','四声：﹨'][question.tone]}</p><div class="options">${l.tones.map((t,i)=>`<button class="option" data-answer="${i}" aria-label="${t}，第${i+1}声">${t}</button>`).join('')}</div>`}body.insertAdjacentHTML('beforeend','<div class="feedback" role="status">慢慢来，再试一次也没关系。</div><button class="secondary" id="next-question" hidden>再玩一题 →</button>');if(mode==='listen')document.querySelector('#play-question').onclick=()=>speak(l.sound);body.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b));document.querySelector('#next-question').onclick=nextQuestion}
function answer(b){if(answered)return;const correct=mode==='listen'?b.dataset.answer===question.letter.key:+b.dataset.answer===question.tone;const f=document.querySelector('.feedback');if(correct){answered=true;b.classList.add('correct');f.textContent='找到了！送你一颗小星星 ★';state.stars++;save();document.querySelector('#next-question').hidden=false;speak('找到了，你真棒')}else{b.classList.add('retry');b.setAttribute('aria-label',b.getAttribute('aria-label')+'，再试试');f.textContent='差一点点，再看看、再试试。';setTimeout(()=>b.classList.remove('retry'),800)}}
function renderStars(){view.innerHTML=`<div class="game-layout"><span class="eyebrow">每一颗星星，都是你的尝试</span><div class="stars-display">${state.stars?'★'.repeat(Math.min(state.stars,18)):'☆ ☆ ☆'}</div><h3>${state.stars?'已经收集 '+state.stars+' 颗小星星啦！':'第一颗小星星，在等你呀'}</h3><p style="font-size:13px;color:var(--muted)">认识朋友、完成小游戏，都能收获星星。</p><button class="primary" id="more-stars">去和拼音朋友玩 →</button></div>`;document.querySelector('#more-stars').onclick=()=>setView('game')}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view,true));document.querySelector('#start').onclick=()=>{setView('learn',true);const i=letters.findIndex(l=>!state.learned.includes(l.key));lesson(i<0?0:i)};document.querySelector('#parent').onclick=()=>{openModal('<span class="eyebrow">给陪伴孩子的大朋友</span><h2>先喜欢，再慢慢学会。</h2><p>每次玩 5 分钟左右就好。可以从一个韵母开始，看嘴型、听示音，一起找找生活里的例子。</p><p>暂时认不出没关系，不催促、不比较。孩子想停时，就一起休息吧。</p><p>这里提供六个单韵母的启蒙练习；声调小游戏练习符号和走势。点读调用设备中文语音，以汉字近似示音。a、o 的多声调没有提供点读，避免误导。</p><p>进度保存在当前浏览器；清除网站数据或换设备后不会同步。</p><button class="secondary" id="reset-progress">重新开始星星记录</button>');document.querySelector('#reset-progress').onclick=()=>{openModal('<h2>重新开始记录？</h2><p>将清空当前浏览器里的已认识字母和小星星。</p><button class="secondary" id="cancel-reset">保留记录</button> <button class="primary" id="confirm-reset">清空并重新开始</button>');document.querySelector('#cancel-reset').onclick=()=>modal.close();document.querySelector('#confirm-reset').onclick=()=>{state={learned:[],stars:0};save();modal.close();setView('learn');toast('新的一次小冒险，开始啦')}}};document.querySelector('#about').onclick=()=>openModal('<h2>关于点读发音</h2><p>点读使用当前设备的中文语音，将「啊、喔、鹅、衣、乌、迂」作为近似示音，不是录制的标准拼音课程。语音效果因设备而异，请由家长陪同示范嘴型和发音。</p><p>如设备没有中文语音或无法播放，可以直接由家长带读。声调小游戏通过符号和走势认知四声，不进行发音评分。</p>');setView('learn');
</script></body></html>
